# 开发 PR（功能分支 push）和合入 MR（目标 develop）共用快路径。目标 10–15 分钟。
lint:
  stage: validate
  extends:
    - .verify_rules
    - .go_cache
    - .golang_image
  timeout: 15m
  script:
    - export PATH="$GOBIN:$PATH"
    - bash ci/validate-release-assets.sh ci/release.yml
    - test -z "$(gofmt -l $(git ls-files '*.go'))"
    - go vet ./...
    - bash ci/install-golangci-lint.sh
    - golangci-lint run
    - go mod tidy
    - git diff --exit-code -- go.mod go.sum

test:
  stage: test
  extends:
    - .go_code_rules
    - .go_cache
    - .golang_image
  timeout: 20m
  variables:
    # 限流并行：Runner 与其他任务共享且可能满载，默认每个 -race 测试
    # 二进制按全部核数起线程（28 包 × 28 线程抢 28 核），调度饥饿曾使
    # 时序敏感的集成/交互测试连续超时（Pipeline #5014/#5020）。
    # -p 2 × GOMAXPROCS=8 = 16 工作线程，低于核数消除超订，同时保留
    # 并行度（全量时长与默认并行相当）。
    # 注意：限流只解决调度饥饿。#5377/#5389/#5403 的连续超时是另一种
    # 原因——测试量与固定成本增长，不是线程争抢；处理方式见下方 script
    # 注释，不要把这两类超时混为一谈。
    GOMAXPROCS: "8"
  script:
    - export PATH="$GOBIN:$PATH"
    - mkdir -p .output
    # 数据库测试不要各自 Open + Migrate：-race 与 coverage 同时开启时 Migrate
    # 单次实测约 1.1 秒，几十个用例逐个从空库建库会把本任务推过 20 分钟上限
    # （Pipeline #5377/#5389/#5403 连续超时，internal/agent/runtime 一度 524 秒）。
    # 测试统一经 internal/store/storetest 复用一份已迁移模板的私有副本（自带装配
    # 入口的测试用 SeedMigratedAt），测试间隔离性不变。改后本机同参数全量
    # （-p 2 -race -coverprofile）1 分 38 秒，internal/agent/runtime 由 97.5 秒降到
    # 8.2 秒，总覆盖率不变（59.0%）。新增数据库测试请使用该辅助包，不要退回逐用例建库。
    - go test -p 2 ./... -race -count=1 -coverprofile=.output/coverage.out
  artifacts:
    when: always
    paths:
      - .output/coverage.out
    expire_in: 7 days

v040_contracts:
  stage: test
  extends:
    - .simulation_contract_rules
    - .go_cache
    - .golang_image
  timeout: 15m
  script:
    - export PATH="$GOBIN:$PATH"
    - make test-v040-contracts

gitleaks:
  stage: security
  extends:
    - .verify_rules
    - .golang_image
  timeout: 5m
  variables:
    GIT_DEPTH: "1"
  script:
    - bash ci/install-gitleaks.sh
    - mkdir -p /tmp/gitleaks-src
    - git archive HEAD | tar -x -C /tmp/gitleaks-src
    - .ci-bin/gitleaks detect --no-git --source /tmp/gitleaks-src --config /tmp/gitleaks-src/.gitleaks.toml --verbose

build:
  stage: build
  extends:
    - .verify_rules
    - .go_cache
    - .golang_image
  timeout: 15m
  needs:
    - lint
    - job: test
      optional: true
    - gitleaks
    - job: v040_contracts
      optional: true
  script:
    - export PATH="$GOBIN:$PATH"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BUILD_VERSION="$(echo "$CI_COMMIT_TAG" | sed 's/^v//')"
      else
        BUILD_VERSION="dev-$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA"
      fi
      make build VERSION="$BUILD_VERSION"
      echo "BUILD_VERSION=$BUILD_VERSION" > build.env
  artifacts:
    paths:
      - .output/bin/
    reports:
      dotenv: build.env
    expire_in: 7 days
