name: Native Windows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-ldflags=-extldflags=-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.25.8
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        id: mingw
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Select compiler for statically linked MuPDF
        run: '"${{ steps.mingw.outputs.msys2-location }}/mingw64/bin" >> $env:GITHUB_PATH'
      - name: Build native CLI, server and Pilot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .output/bin | Out-Null
          foreach ($name in @('semantic', 'semantic-server', 'semantic-pilot')) {
            go build -trimpath -o ".output/bin/$name.exe" "./cmd/$name"
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $name" }
          }
          "SEMANTIC_NATIVE_BIN=$((Resolve-Path .output/bin).Path)" >> $env:GITHUB_ENV
      - name: Process contracts and real server lifecycle
        run: go test -json ./internal/ports/... -count=1 -timeout=4m > windows-contracts.json
      - name: PowerShell execution, permission gates and cancellation
        run: go test -json ./internal/tool/builtin -run 'TestExecuteHost|TestWindowsHost' -count=1 -timeout=3m > windows-host-tests.json
      - name: Package development executables
        run: Compress-Archive -Path .output/bin/* -DestinationPath semantic-framework-windows-amd64-development.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: semantic-framework-windows-amd64-development
          path: |
            semantic-framework-windows-amd64-development.zip
            windows-contracts.json
            windows-host-tests.json
          if-no-files-found: error
